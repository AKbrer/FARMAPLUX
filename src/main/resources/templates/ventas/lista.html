<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ventas - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div th:if="${success}" class="alert alert-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span th:text="${success}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span th:text="${error}"></span>
      </div>
      <div class="page-header">
        <div>
          <h1 class="page-title">Ventas</h1>
          <p class="page-desc">Historial de ventas realizadas</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-primary" th:href="@{/ventas/nueva}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Nueva Venta
          </a>
        </div>
      </div>
      <div class="content-card">
        <div class="card-header">
          <form th:action="@{/ventas}" method="get" class="filters-bar">
            <div class="search-box">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" name="q" th:value="${q}" placeholder="Buscar por cliente..." />
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
            <a th:href="@{/ventas}" class="btn btn-outline btn-sm">Limpiar</a>
          </form>
        </div>
        <div class="card-content">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Fecha</th>
                  <th>Atendido por</th>
                  <th>Cliente</th>
                  <th>Total</th>
                  <th>Método Pago</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="v : ${page.content}">
                  <td th:text="${v.id}" style="font-weight:600;"></td>
                  <td th:text="${v.fecha}" style="font-size:0.8125rem;color:var(--text-secondary);"></td>
                  <td th:text="${v.usuario?.nombre}"></td>
                  <td th:text="${v.clientePresencial?.nombre}"></td>
                  <td style="font-weight:700;color:var(--primary);">$<span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                  <td>
                    <span class="badge" th:classappend="${v.metodoPago == 'EFECTIVO'} ? 'badge-success' : 'badge-outline'" th:text="${v.metodoPago}"></span>
                  </td>
                  <td>
                    <div class="actions-cell">
                      <a class="btn btn-icon btn-icon-sm btn-ghost" th:href="@{/ventas/{id}(id=${v.id})}" title="Ver detalle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                      </a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${page.content.isEmpty()}">
                  <td colspan="7">
                    <div class="empty-state">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/></svg>
                      <h3>No hay ventas</h3>
                      <p>Comienza registrando una nueva venta</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments/pagination :: pagination(${page})}"></div>
        </div>
      </div>
    </main>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
