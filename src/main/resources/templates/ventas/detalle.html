<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de venta - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">Detalle de Venta #<span th:text="${venta.id}"></span></h1>
          <p class="page-desc" th:text="${venta.fecha}"></p>
        </div>
        <div class="page-actions">
          <a class="btn btn-outline" th:href="@{/ventas}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Volver a ventas
          </a>
        </div>
      </div>
      <div class="content-card" style="max-width:680px;margin:0 auto;">
        <div class="card-content-padded">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);">
            <div>
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Atendido por</strong>
              <span style="font-weight:600;" th:text="${venta.usuario?.nombre}"></span>
            </div>
            <div>
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Cliente</strong>
              <span style="font-weight:600;" th:text="${venta.clientePresencial?.nombre}"></span>
            </div>
            <div>
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Documento</strong>
              <span th:text="${venta.clientePresencial?.documento}"></span>
            </div>
            <div>
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Método de pago</strong>
              <span class="badge badge-success" th:text="${venta.metodoPago}"></span>
            </div>
            <div>
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Monto pagado</strong>
              <span style="font-weight:600;">$<span th:text="${#numbers.formatDecimal(venta.montoPagado, 1, 2)}"></span></span>
            </div>
            <div th:if="${venta.cambio > 0}">
              <strong style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;">Cambio</strong>
              <span style="font-weight:700;color:var(--success);">$<span th:text="${#numbers.formatDecimal(venta.cambio, 1, 2)}"></span></span>
            </div>
          </div>

          <h3 style="font-size:1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:var(--primary);"><path d="M16.5 9.4 7.55 4.24a1 1 0 0 0-1.1 0L5 5.07"/><path d="M18.5 12.5v5.26A2 2 0 0 1 16 19.7l-5.5 2.7a2 2 0 0 1-1.8 0L3.3 17.2A2 2 0 0 1 2 15.44V9.22"/></svg>
            Productos
          </h3>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Cantidad</th>
                  <th>Precio unitario</th>
                  <th>Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="d : ${venta.detalles}">
                  <td th:text="${d.nombreProducto}" style="font-weight:600;"></td>
                  <td th:text="${d.cantidad}"></td>
                  <td>$<span th:text="${#numbers.formatDecimal(d.precio, 1, 2)}"></span></td>
                  <td style="font-weight:600;color:var(--primary);">$<span th:text="${#numbers.formatDecimal(d.cantidad * d.precio, 1, 2)}"></span></td>
                </tr>
              </tbody>
              <tfoot>
                <tr>
                  <th colspan="3" style="text-align:right;font-size:1rem;padding-top:16px;">Total</th>
                  <th style="color:var(--primary);font-size:1.125rem;padding-top:16px;">$<span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}"></span></th>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
