<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerrando sesión - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <meta http-equiv="refresh" content="1.5;url=/login" />
  </head>
  <body class="logout-page">
    <div class="logout-card">
      <div class="logout-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      </div>
      <div class="auth-brand" style="margin-bottom:12px;">Farma<span>Plus</span></div>
      <h2 style="font-size:1.25rem;font-weight:600;">Sesión cerrada</h2>
      <p style="color:var(--text-secondary);margin-top:8px;font-size:0.875rem;">Redirigiendo al inicio de sesión...</p>
    </div>
    <script>
      localStorage.removeItem('jwt');
      localStorage.removeItem('user');
      localStorage.removeItem('carrito');
    </script>
  </body>
</html>
