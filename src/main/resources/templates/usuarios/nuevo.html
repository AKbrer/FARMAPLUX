<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo usuario - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div class="form-page-wrap">
        <div class="form-page-header">
          <div class="form-page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="form-page-header-text">
            <h1>Nuevo Usuario</h1>
            <p>Registra un nuevo usuario del sistema</p>
          </div>
        </div>

        <div class="form-page-card">
          <div class="form-page-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Credenciales de acceso</span>
          </div>
          <div class="form-page-card-body">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
              <div th:replace="~{fragments/csrf :: csrfToken}"></div>
              <div class="form-group">
                <label class="form-label">Nombre completo <span class="required">*</span></label>
                <div class="form-input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  <input class="form-input" type="text" th:field="*{nombre}" required placeholder="Nombre completo del usuario" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Correo electrónico <span class="required">*</span></label>
                <div class="form-input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  <input class="form-input" type="email" th:field="*{correo}" required placeholder="correo@ejemplo.com" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Contraseña <span class="required">*</span></label>
                <div class="form-input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <input class="form-input" type="password" th:field="*{password}" required placeholder="Ingrese una contraseña segura" />
                </div>
                <p class="form-hint">Mínimo 8 caracteres</p>
              </div>
              <div class="form-group">
                <label class="form-label">Rol del usuario</label>
                <div class="form-input-wrap">
                  <select class="form-select" th:field="*{rol}" style="padding-left:14px;">
                    <option value="ROLE_ADMIN">Administrador</option>
                    <option value="ROLE_CLIENTE">Cliente</option>
                  </select>
                </div>
              </div>
              <div class="form-actions">
                <a class="btn btn-outline" th:href="@{/usuarios}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                  Cancelar
                </a>
                <button class="btn btn-primary" type="submit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                  Guardar usuario
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
