<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="catalogo-page">
    <div class="catalogo-header-bar">
      <div class="catalogo-header-inner">
        <a th:href="@{/catalogo}" class="catalogo-logo">
          <div class="logo-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
          </div>
          <div class="catalogo-title">
            <h1>FarmaPlus</h1>
            <p>Catálogo de Productos</p>
          </div>
        </a>
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn btn-outline" id="cartHeaderBtn" onclick="toggleCart()" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><circle cx="8" cy="21" r="1"/><circle cx="21" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Carrito (<span id="cart-count-header">0</span>)
          </button>
          <a th:href="@{/logout}" class="btn btn-ghost" style="color:var(--danger);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </a>
        </div>
      </div>
    </div>

    <div class="catalogo-container">
      <div class="catalogo-page-title">
        <h2>Nuestros Productos</h2>
        <p>Explora nuestro catálogo de productos farmacéuticos</p>
      </div>

      <div class="catalogo-filters">
        <form th:action="@{/catalogo}" method="get">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" name="nombre" th:value="${nombre}" placeholder="Buscar producto..." />
          </div>
          <select name="categoriaId" class="filter-select-lg">
            <option value="">Todas las categorías</option>
            <option th:each="c : ${categorias}"
                    th:value="${c.id}"
                    th:selected="${categoriaId == c.id}"
                    th:text="${c.nombre}"></option>
          </select>
          <button type="submit" class="btn btn-primary">Filtrar</button>
          <a th:href="@{/catalogo}" class="btn btn-outline">Limpiar</a>
        </form>
      </div>

      <div class="catalogo-layout">
        <div class="catalogo-grid-wrap">

          <div th:if="${page.content.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <h3>No se encontraron productos</h3>
            <p>Intenta con otros términos de búsqueda o categorías</p>
          </div>

          <div class="product-grid" id="productos-container" th:unless="${page.content.isEmpty()}">
            <div class="product-card"
                 th:each="p : ${page.content}"
                 th:classappend="${p.stock <= p.stockMinimo} ? 'stock-low' : ''"
                 th:attr="data-id=${p.id}, data-nombre=${p.nombre}, data-precio=${p.precioVenta}, data-stock=${p.stock}">

              <div class="card-image-wrap">
                <img th:if="${p.imagenUrl}" th:src="${p.imagenUrl}" th:alt="${p.nombre}" />
                <div th:unless="${p.imagenUrl}" class="card-image-placeholder">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24a1 1 0 0 0-1.1 0L5 5.07"/><path d="M18.5 12.5v5.26A2 2 0 0 1 16 19.7l-5.5 2.7a2 2 0 0 1-1.8 0L3.3 17.2A2 2 0 0 1 2 15.44V9.22"/><path d="M8.5 4.5 2.7 7.84A2 2 0 0 0 2 9.5"/><path d="m10 13 2 2 4-4"/></svg>
                </div>
                <span class="card-cat-badge" th:text="${p.categoria?.nombre ?: 'General'}"></span>
                <span th:if="${p.stock <= p.stockMinimo}" class="card-lowstock-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:11px;height:11px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                  Stock bajo
                </span>
              </div>

              <div class="card-body">
                <h3 class="card-name" th:text="${p.nombre}"></h3>
                <div class="card-meta">
                  <span class="card-price">$<span th:text="${#numbers.formatDecimal(p.precioVenta, 1, 2)}"></span></span>
                  <span class="card-stock" th:classappend="${p.stock <= p.stockMinimo} ? 'low' : 'ok'">
                    <span class="card-stock-dot"></span>
                    <span th:if="${p.stock > 0}" th:text="${p.stock + ' uds.'}"></span>
                    <span th:if="${p.stock <= 0}">Agotado</span>
                  </span>
                </div>
                <div class="card-footer-actions">
                  <button class="btn btn-primary" onclick="agregarAlCarrito(this.closest('.product-card'))" th:disabled="${p.stock <= 0}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><circle cx="8" cy="21" r="1"/><circle cx="21" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span th:if="${p.stock > 0}">Agregar</span>
                    <span th:unless="${p.stock > 0}">Sin stock</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div th:if="${page.totalPages > 1}" class="pagination">
            <a th:if="${!page.isFirst()}"
               th:href="@{''(page=${page.number - 1}, size=${page.size}, nombre=${param.nombre}, categoriaId=${param.categoriaId})}"
               class="page-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="15 18 9 12 15 6"/></svg>
            </a>
            <th:block th:with="
                start = ${page.number - 2 > 0 ? page.number - 2 : 0},
                end = ${page.number + 2 < page.totalPages - 1 ? page.number + 2 : page.totalPages - 1}">
              <a th:if="${start > 0}" th:href="@{''(page=0, size=${page.size}, nombre=${param.nombre}, categoriaId=${param.categoriaId})}" class="page-link">1</a>
              <span th:if="${start > 1}" class="page-link dots">...</span>
              <span th:each="i : ${#numbers.sequence(start, end)}">
                <a th:if="${i != page.number}"
                   th:href="@{''(page=${i}, size=${page.size}, nombre=${param.nombre}, categoriaId=${param.categoriaId})}"
                   class="page-link" th:text="${i + 1}"></a>
                <span th:if="${i == page.number}" class="page-link active" th:text="${i + 1}"></span>
              </span>
              <span th:if="${end < page.totalPages - 2}" class="page-link dots">...</span>
              <a th:if="${end < page.totalPages - 1}"
                 th:href="@{''(page=${page.totalPages - 1}, size=${page.size}, nombre=${param.nombre}, categoriaId=${param.categoriaId})}"
                 class="page-link" th:text="${page.totalPages}"></a>
            </th:block>
            <a th:if="${!page.isLast()}"
               th:href="@{''(page=${page.number + 1}, size=${page.size}, nombre=${param.nombre}, categoriaId=${param.categoriaId})}"
               class="page-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="9 18 15 12 9 6"/></svg>
            </a>
          </div>
        </div>

        <aside class="cart-sidebar" id="cart-sidebar">
          <div class="cart-header">
            <h3>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><circle cx="8" cy="21" r="1"/><circle cx="21" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              Carrito <span class="cart-count-badge" id="cart-count">0</span>
            </h3>
            <button class="cart-toggle-btn" id="cartToggleBtn" onclick="toggleCart()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div id="cart-items" class="cart-items"></div>
          <div class="cart-total">
            <span>Total:</span>
            <span>$<span id="cart-total-amount">0.00</span></span>
          </div>
          <div class="cart-actions">
            <button id="whatsapp-btn" class="btn-whatsapp" onclick="enviarWhatsApp()" disabled>
              <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Enviar a WhatsApp
            </button>
            <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
          </div>
        </aside>
      </div>
    </div>

    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

    <script th:src="@{/js/catalogo.js}"></script>
  </body>
</html>
