<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Producto - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div class="form-page-wrap">

        <div th:if="${error}" class="alert alert-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          <span th:text="${error}"></span>
        </div>

        <div class="form-page-header">
          <div class="form-page-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24a1 1 0 0 0-1.1 0L5 5.07"/><path d="M18.5 12.5v5.26A2 2 0 0 1 16 19.7l-5.5 2.7a2 2 0 0 1-1.8 0L3.3 17.2A2 2 0 0 1 2 15.44V9.22"/><path d="M8.5 4.5 2.7 7.84A2 2 0 0 0 2 9.5"/></svg>
          </div>
          <div class="form-page-header-text">
            <h1>Nuevo Producto</h1>
            <p>Registra un nuevo producto en el inventario farmacéutico</p>
          </div>
        </div>

        <div class="form-page-card">
          <div class="form-page-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.55 4.24a1 1 0 0 0-1.1 0L5 5.07"/><path d="M18.5 12.5v5.26A2 2 0 0 1 16 19.7l-5.5 2.7a2 2 0 0 1-1.8 0L3.3 17.2A2 2 0 0 1 2 15.44V9.22"/><path d="M8.5 4.5 2.7 7.84A2 2 0 0 0 2 9.5"/></svg>
            <span>Datos del producto</span>
          </div>
          <div class="form-page-card-body">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
              <div th:replace="~{fragments/csrf :: csrfToken}"></div>

              <div class="form-group">
                <label class="form-label">Imagen del producto</label>
                <input class="form-input" type="file" name="imagen" id="imagenInput" accept="image/*" />
                <div class="form-hint">JPG, PNG o WEBP.</div>
                <img id="imagenPreview" alt="Vista previa" style="display:none;width:72px;height:72px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:10px;" />
              </div>

              <div class="form-group">
                <label class="form-label">Nombre del producto <span class="required">*</span></label>
                <div class="form-input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
                  <input class="form-input" type="text" th:field="*{nombre}" required placeholder="Ej: Paracetamol 500mg" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Código de barras / Referencia</label>
                <div class="form-input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6v12"/><path d="M6 6v12"/><path d="M10 6v12"/><path d="M14 6v12"/><path d="M18 6v12"/><path d="M22 6v12"/></svg>
                  <input class="form-input" type="text" th:field="*{codigoBarras}" placeholder="Opcional" />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Categoría</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
                    <select class="form-select" name="categoria.id" style="padding-left:42px;">
                      <option value="">Seleccionar categoría...</option>
                      <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                              th:selected="${producto.categoria != null and producto.categoria.id == c.id}"></option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Proveedor</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>
                    <select class="form-select" name="proveedor.id" style="padding-left:42px;">
                      <option value="">Seleccionar proveedor...</option>
                      <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}"
                              th:selected="${producto.proveedor != null and producto.proveedor.id == p.id}"></option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Precio de compra</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <input class="form-input" type="number" step="0.01" min="0" th:field="*{precioCompra}" id="precioCompra" placeholder="0.00" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Precio de venta</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <input class="form-input" type="number" step="0.01" min="0" th:field="*{precioVenta}" id="precioVenta" placeholder="0.00" />
                  </div>
                  <div class="form-error" id="margenAviso" style="display:none;">El precio de venta es menor al de compra.</div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Stock inicial</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    <input class="form-input" type="number" min="0" th:field="*{stock}" placeholder="0" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Stock mínimo</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
                    <input class="form-input" type="number" min="0" th:field="*{stockMinimo}" placeholder="0" />
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Fecha de vencimiento</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    <input class="form-input" type="date" th:field="*{fechaVencimiento}" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Lote</label>
                  <div class="form-input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
                    <input class="form-input" type="text" th:field="*{lote}" placeholder="Número de lote" />
                  </div>
                </div>
              </div>

              <div class="form-actions">
                <a class="btn btn-outline" th:href="@{/productos}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                  Cancelar
                </a>
                <button class="btn btn-primary" type="submit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                  Guardar producto
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script th:src="@{/js/app.js}"></script>
    <script>
      (function () {
        var input = document.getElementById('imagenInput');
        var preview = document.getElementById('imagenPreview');
        if (input && preview) {
          input.addEventListener('change', function () {
            var f = input.files && input.files[0];
            if (!f) { preview.style.display = 'none'; return; }
            preview.src = URL.createObjectURL(f);
            preview.style.display = 'block';
          });
        }
        var compra = document.getElementById('precioCompra');
        var venta = document.getElementById('precioVenta');
        var aviso = document.getElementById('margenAviso');
        function revisar() {
          var c = parseFloat(compra.value), v = parseFloat(venta.value);
          aviso.style.display = (!isNaN(c) && !isNaN(v) && v < c) ? 'block' : 'none';
        }
        if (compra && venta && aviso) {
          compra.addEventListener('input', revisar);
          venta.addEventListener('input', revisar);
          revisar();
        }
      })();
    </script>
  </body>
</html>
