<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-logo-wrap">
        <div class="auth-logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
        </div>
        <div class="auth-brand">Farma<span>Plus</span></div>
      </div>
      <h2>Bienvenido de nuevo</h2>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder al sistema</p>

      <div id="error-msg" class="alert alert-error" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span></span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input class="form-input" type="email" id="correo" placeholder="correo@ejemplo.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password" />
        </div>

        <div class="auth-extra-links">
          <label class="remember-me">
            <input type="checkbox" checked />
            Recordarme
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary">Ingresar</button>
      </form>

      <div class="auth-divider">O continúa con</div>

      <a th:href="@{/oauth2/authorization/google}" class="auth-google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Iniciar sesión con Google
      </a>

      <div class="auth-link">
        ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
      </div>
    </div>
    <script th:src="@{/js/login.js}"></script>
  </body>
</html>
