<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proveedores - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div th:if="${success}" class="alert alert-success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span th:text="${success}"></span>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span th:text="${error}"></span>
      </div>
      <div class="page-header">
        <div>
          <h1 class="page-title">Proveedores</h1>
          <p class="page-desc">Gestión de distribuidores y proveedores</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-primary" th:href="@{/proveedores/nuevo}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Nuevo Proveedor
          </a>
        </div>
      </div>
      <div class="content-card">
        <div class="card-header">
          <form th:action="@{/proveedores}" method="get" class="filters-bar">
            <div class="search-box">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre..." />
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
            <a th:href="@{/proveedores}" class="btn btn-outline btn-sm">Limpiar</a>
          </form>
        </div>
        <div class="card-content">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Empresa</th>
                  <th>Dirección</th>
                  <th>Teléfono</th>
                  <th>Email</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${page.content}">
                  <td th:text="${p.id}" style="font-weight:600;"></td>
                  <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div style="width:36px;height:36px;background:#fef3c7;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#d97706;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/></svg>
                      </div>
                      <span style="font-weight:600;" th:text="${p.nombre}"></span>
                    </div>
                  </td>
                  <td style="color:var(--text-secondary);" th:text="${p.direccion}"></td>
                  <td th:text="${p.telefono}"></td>
                  <td style="color:var(--secondary);" th:text="${p.email}"></td>
                  <td>
                    <div class="actions-cell">
                      <a class="btn btn-icon btn-icon-sm btn-ghost" th:href="@{/proveedores/editar/{id}(id=${p.id})}" title="Editar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                      </a>
                      <a class="btn btn-icon btn-icon-sm btn-ghost" th:href="@{/proveedores/eliminar/{id}(id=${p.id})}" style="color:var(--danger);" title="Eliminar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                      </a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${page.content.isEmpty()}">
                  <td colspan="6">
                    <div class="empty-state">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/></svg>
                      <h3>No hay proveedores</h3>
                      <p>Comienza agregando un nuevo proveedor</p>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div th:replace="~{fragments/pagination :: pagination(${page})}"></div>
        </div>
      </div>
    </main>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
