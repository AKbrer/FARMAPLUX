<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar proveedor - FarmaPlus</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/editar_proveedores.css}" />
  </head>
  <body class="admin-layout">
    <button class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-main">
      <div class="form-page-card">
        <h1 class="page-title">Editar Proveedor</h1>
        <p class="page-subtitle">Actualiza la información comercial y de contacto del proveedor.</p>
        <form th:action="@{/proveedores/actualizar}" th:object="${proveedor}" method="post">
          <input type="hidden" th:field="*{id}" />
          <div th:replace="~{fragments/csrf :: csrfToken}"></div>
          <div class="form-group">
            <label class="form-label">Nombre de la empresa <span class="required">*</span></label>
            <input class="form-input" type="text" th:field="*{nombre}" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Teléfono</label>
              <input class="form-input" type="text" th:field="*{telefono}" />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" type="email" th:field="*{email}" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Dirección</label>
            <textarea class="form-textarea" th:field="*{direccion}"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"/><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"/></svg>
              Actualizar proveedor
            </button>
            <a class="btn btn-outline" th:href="@{/proveedores}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              Cancelar
            </a>
          </div>
        </form>
      </div>
    </main>
    <script th:src="@{/js/editar_proveedores.js}"></script>
  </body>
</html>
